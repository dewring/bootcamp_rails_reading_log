default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: bootcamp_rails_reading_log_development
  queue:
    <<: *default
    database: bootcamp_rails_reading_log_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: bootcamp_rails_reading_log_test
  queue:
    <<: *default
    database: bootcamp_rails_reading_log_test_queue
    migrations_paths: db/queue_migrate

production:
  primary: &production_default
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *production_default
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_default
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_default
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
